name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { image: "ubuntu:23.10", flags: "DEBUG=0" }
          - { image: "ubuntu:23.10", flags: "DEBUG=1" }
          - { image: "ubuntu:23.10", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "ubuntu:latest", flags: "DEBUG=0" }
          - { image: "ubuntu:latest", flags: "DEBUG=1" }
          - { image: "ubuntu:latest", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "fedora:39", flags: "DEBUG=0" }
          - { image: "fedora:39", flags: "DEBUG=1" }
          - { image: "fedora:39", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "fedora:latest", flags: "DEBUG=0" }
          - { image: "fedora:latest", flags: "DEBUG=1" }
          - { image: "fedora:latest", flags: "DEBUG=1 OPTIMIZE=-O3" }

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          # apt-get keeps non-interactive output stable in CI.
          sudo apt-get update
          packages=$(grep -Ev '^[[:space:]]*#|^[[:space:]]*$' .github/ci/ubuntu-test-packages.txt)
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends podman $packages

      - name: Check loop devices
        run: |
          # Fail early: the disk image builders need a free loop device.
          test -e /dev/loop-control
          sudo losetup --find

      - name: Build kernel and app in ${{ matrix.image }}
        run: |
          sudo podman run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            "${{ matrix.image }}" \
            sh .github/ci/build-in-container.sh "${{ matrix.flags }}"

      - name: Run tests (SMP=1)
        run: make test SMP=1

      - name: Run tests (SMP=4)
        run: make test SMP=4

      - name: Run tests (SMP=16)
        run: make test SMP=16
