name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { image: "ubuntu:23.10", flags: "DEBUG=0 OPTIMIZE=-O3" }
          - { image: "ubuntu:23.10", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "ubuntu:23.10", flags: "" }

          - { image: "ubuntu:26.04", flags: "DEBUG=0 OPTIMIZE=-O3" }
          - { image: "ubuntu:26.04", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "ubuntu:26.04", flags: "" }

          - { image: "fedora:39", flags: "DEBUG=0 OPTIMIZE=-O3" }
          - { image: "fedora:39", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "fedora:39", flags: "" }

          - { image: "fedora:45", flags: "DEBUG=0 OPTIMIZE=-O3" }
          - { image: "fedora:45", flags: "DEBUG=1 OPTIMIZE=-O3" }
          - { image: "fedora:45", flags: "" }

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          # apt-get keeps non-interactive output stable in CI.
          sudo apt-get update
          packages=$(grep -Ev '^[[:space:]]*#|^[[:space:]]*$' .github/ci/ubuntu-test-packages.txt)
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends podman $packages

      - name: Check loop devices
        run: |
          # Fail early: the disk image builders need a free loop device.
          test -e /dev/loop-control
          sudo losetup --find

      - name: Setup venv
        run: make venv

      - name: Build ${{ matrix.image }} container
        run: make BUILD_IMAGE="${{ matrix.image }}" container

      - name: Build kernel and app
        run: make ${{ matrix.flags }} kernel app

      - name: Create disk images
        run: make disk-image

      - name: Run tests (SMP=1)
        run: make SMP=1 LIT_JOBS=1 test

      - name: Run tests (SMP=4)
        run: make SMP=4 LIT_JOBS=1 test

      - name: Run tests (SMP=16)
        run: make SMP=16 LIT_JOBS=1 test
