# Restart the GUI session after changing these settings.
# Font families: bitmap, DejaVu Sans, DejaVu Sans Bold,
# DejaVu Sans Mono, DejaVu Sans Mono Bold.
font_family=bitmap
# TrueType pixel size: 8-32. The bitmap font stays fixed at 10 pixels.
font_size=10
# Color schemes: default, dark, light, solarized-dark.
color_scheme=default

# Absolute guest PNG/BMP path. Leave empty to disable wallpaper.
# The default image is optional; a missing image uses the solid background.
wallpaper=/usr/share/mario/wallpaper.png

# Optional overrides (colors always override the selected scheme):
# font_path=/root/fonts/MyFont.ttf
# background=#1f2933
# panel=#111827
# active=#2563eb
# inactive=#475569
# foreground=#f8fafc
# error=#ef4444
# border=#0f172a
# content=#f8fafc
