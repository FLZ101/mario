# Restart the terminal after changing these settings.
# DejaVu Sans Mono pixel size: 8-48.
font_size=14
# Content padding in pixels on each side.
padding=0
# Color schemes: default, dark, light, solarized-dark.
color_scheme=default
# Opacity: 0-100 percent. 100 is fully opaque.
opacity=100

