# The tmux server has a set of global server options which do not apply to any particular window or session or pane.

# Each individual session may have a set of session options, and there is a separate set of global session options. Sessions which do not have a particular option configured inherit the value from the global session options.

# A set of window options is attached to each window and a set of pane options to each pane. Pane options inherit from window options. This means any pane option may be set as a window option to apply the option to all panes in the window without the option set.

# There is also a set of global window options from which any unset window or pane options are inherited.

bind r {
    source-file ~/.tmux.conf
    display "Reloaded!"
}

bind ? list-keys

# --- server options

set -s exit-empty on
set -s default-terminal screen
set -s escape-time 0
set -s set-clipboard off

# --- global session options

set -g display-time 0
set -g display-panes-time 3000

set -g mouse on

set -g prefix C-a
set -g prefix2 None
set -g repeat-time 1000

# --- global window options

set -wg clock-mode-style 24
set -wg wrap-search on

# --- names and titles

# The name is the identifier for a window or session. Only panes have titles. A pane's title is typically set by the program running inside the pane using an escape sequence (like it would set the xterm(1) window title). Windows themselves do not have titles - a window's title is the title of its active pane. Tmux itself may set the title of the terminal in which the client is running, see the set-titles option.

# Sessions, window and panes are each numbered with a unique ID; session IDs are prefixed with a ‘$’, windows with a ‘@’, and panes with a ‘%’. These are unique and are unchanged for the life of the session, window or pane in the tmux server.

set -g set-titles on
set -g set-titles-string "#{pane_title}"

set -g base-index 1
set -g renumber-windows on
set -wg automatic-rename on
set -wg automatic-rename-format "#I"
set -wg allow-rename off

set -wg pane-base-index 1

# --- status line

set -g status on
set -g status-keys vi
set -g status-position bottom

set -g status-left "#[bg=black,fg=white] #{pane_index}#{?window_zoomed_flag,Z,} #[bg=white,fg=black] #{pane_tty} | #{=32:pane_current_command}"
set -g status-left-length 45
set -g status-right ""
set -g status-right-length 0
set -g status-justify right
set -g status-interval 1

set -g status-style bg=white,fg=black
set -g status-left-style bg=black,fg=white
set -g message-style bg=white,fg=black
set -g message-command-style bg=white,fg=black

set -wg window-status-format "#{?window_activity_flag,~, }#{window_index}#{?window_activity_flag,~, }"
set -wg window-status-current-format " #{window_index} "
set -wg window-status-separator ""

set -wg window-status-style bg=white,fg=black
set -wg window-status-current-style bg=black,fg=white
set -wg window-status-activity-style bg=white,fg=black

# --- monitoring

set -wg monitor-activity on
set -g activity-action current
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

set -wg monitor-bell off
set -wg monitor-silence 0

# --- windows

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r Left select-window -t :+
bind -r Right next-window -t :-

# --- window history (i.e. : command history)

set -g history-limit 1000

# --- panes

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind m select-pane -m

bind Up break-pane
bind M-- move-pane -v -s "{marked}"
bind M-| move-pane -h -s "{marked}"

bind g display-panes -d 0
bind G display-panes -d 0 "swap-pane -d -t '%%'"

bind M-g choose-tree -Z

bind M-l display-menu -x C -y C \
    even-horizontal 1 "select-layout even-horizontal" \
    even-vertical 2 "select-layout even-vertical" \
    main-horizontal 3 "select-layout main-horizontal" \
    main-vertical 4 "select-layout main-vertical" \
    tiled 5 "select-layout tiled"

# --- buffers

# Tmux maintains a set of named paste buffers. Each buffer may be either explicitly or automatically named. Automatically named buffers are given a name such as ‘buffer0001’, ‘buffer0002’ and so on. When the buffer-limit option is reached, the oldest automatically named buffer is deleted. Explicitly named buffers are not subject to buffer-limit.

# If a buffer command is used and no buffer is specified, the most recently added automatically named buffer is assumed.

set -s buffer-limit 100

# choose-buffer:
#   j, k, p, d
#   t, T, C-t, P, D
#   v
#   f, O, r
#   /, n, N
#   q

bind b choose-buffer -Z

# --- copy mode; pane history (scrollback buffer)

set -wg mode-keys vi

# h, l, j, k, ^, $, f, F
# w, b, e
# /, ?, n, N
# g, G
# H, L, M
# C-b, C-f, C-u, C-d

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
